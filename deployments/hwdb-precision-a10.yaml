apiVersion: batch/v1
kind: Job
metadata:
  name: hwdb-precision-20260910
  namespace: ecepxie
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 280800
  template:
    metadata:
      labels:
        app: hwdb-precision-20260910
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-A10]
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
      containers:
        - name: matrix
          image: nvcr.io/nvidia/pytorch:26.04-py3
          command: [bash, /launcher/bootstrap_hwdb_precision.sh]
          resources:
            requests:
              cpu: "14"
              memory: 56Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /experiment
              subPath: aypatrl04-hwdb-precision-20260910
            - name: workspace
              mountPath: /datasets/spooky-author-identification/prepared/public
              subPath: data/mlebench/spooky-author-identification/prepared/public
              readOnly: true
            - name: workspace
              mountPath: /datasets/jigsaw-toxic-comment-classification-challenge/prepared/public
              subPath: data/mlebench/jigsaw-toxic-comment-classification-challenge/prepared/public
              readOnly: true
            - name: launcher
              mountPath: /launcher
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: yuze-li-vol
        - name: launcher
          configMap:
            name: hwdb-precision-launcher-20260910
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
